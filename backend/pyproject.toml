[project]
name = "pyq-analyzer-backend"
version = "0.2.0"
description = "PYQ Analyzer — finds, reads and verifies past question papers; insights, practice and lessons"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.30.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "chromadb>=0.5.0",  # classic (v1) pages only
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
